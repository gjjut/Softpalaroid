name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: GUI smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python tools/smoke_gui.py 2>&1 | Tee-Object -FilePath smoke.log
          $code = $LASTEXITCODE
          "### GUI smoke test" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content smoke.log >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          if ($code -ne 0) {
            Get-Content smoke.log -Tail 12 | ForEach-Object {
              "::error::$($_ -replace '%','%25' -replace "`r",'%0D')"
            }
            exit $code
          }

      - name: Build Softpalaroid.exe (PyInstaller)
        run: pyinstaller packaging/Softpalaroid.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Softpalaroid-Windows
          path: |
            dist/installer/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
